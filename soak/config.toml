# Soak test settings (soak/run.py). Times in seconds. Copy and edit for a run; pass with --config.

[orbit]
# A 95-minute low Earth orbit, eclipsed for the last 35%. Shorten period_s to cycle faster on the bench.
period_s = 5700
eclipse_fraction = 0.35
temp_min_c = -10.0
temp_max_c = 35.0

[passes]
# Ground passes: the ground station opens a link only inside them, and just listens (for beacons) in between.
interval_s = 21600
pass_s = 600
offset_s = 300

[radio]
# The HackRF ground station (hil/lib/ground.py). Needs PVDX_ROOT pointing at the PVDXos checkout the flatsat's build came
# from (the ground decodes and uplinks with its sources), and a cabled RF link through at least 60 dB of attenuation.
enabled = false
lna_db = 24                                  # hackrf_transfer -l (RX LNA, 0-40 in 8 dB steps)
vga_db = 20                                  # hackrf_transfer -g (RX VGA, 0-62 in 2 dB steps)
tx_vga_db = 0                                # hackrf_transfer -x (TX VGA, 0-47)
turns_per_pass = 2                           # Handovers each way in a pass (more while the uplink isn't finished)
serial = ""                                  # HackRF serial number, if more than one is plugged in
tx_coded = true                              # Code the ground's frames like the satellite's, once mrfsk.py's code is confirmed
# uplink_settle_s = 300                      # How long after a pass a command may take to show in telemetry (default:
                                             # the link timeout plus three beacon periods)

[radio.commands]
# What each pass uplinks (soak/uplinks.py): SET_UNIX_TIME every pass, plus one step of the rotation
set_unix_time = true
adcs_opmode = true                           # Detumble-only, then back to pointing
toggle_device = "CAMERA_ID"                  # A device_id_t to disable, then enable again ("" for none)

[environment]
update_s = 10                                # How often the tester's inputs follow the orbit
sunlit_photodiode_volts = [1.2, 0.9, 0.6, 0.3]
eclipse_photodiode_volts = [0.0, 0.0, 0.0, 0.0]
pvd_vocs = [0.9, 0.6, 0.3, 0.0]              # Real perovskite board cells (sunlit; 0 in eclipse)
emulated_pixels = true                       # Light the emulated perovskite board's pixels while sunlit

[capture]
interval_s = 3600                            # Edge capture of the magnetorquer and burn lines
seconds = 10

[monitors]
max_log_silence_s = 60
reboot_grace_s = 120
max_warnings_per_hour = 120
min_battery_level = 0.2
max_sweep_gap_s = 1200
default_max_state_s = 600
# Warnings expected on this bench (regexes). The S-band I2C and THERM inputs depend on the wiring; see hil/README.md.
warning_allowlist = [
    "fuel_gauge: no pack read",
]

[monitors.max_state_s]
# Longest stay in each state (names from src/states.h); others use default_max_state_s
STATE_IDLE = 60
STATE_FAKE_HEARTBEAT = 20
STATE_PEROVSKITE_CAPTURE = 330

[runner]
summary_every_s = 300
metrics_every_s = 60
checkpoint_every_s = 60
keep_log_lines = 20000                       # Flatsat log lines kept in memory (all are written to disk)
reconnect_after_s = 120                      # Silence after which the J-Link sessions are reopened (never a reset)
