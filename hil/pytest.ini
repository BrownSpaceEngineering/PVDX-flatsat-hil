[pytest]
testpaths = tests
# The self-test needs jumpers that must not be fitted while the flatsat is wired, and manual tests need a person;
# select them explicitly with -m selftest or -m manual (a later -m replaces this one)
addopts = -m "not selftest and not manual" -ra
markers =
    selftest: tester checking itself through jumpers, with the flatsat disconnected
    manual: needs someone to move the board during the test
    slow: takes several minutes
    hackrf: needs the HackRF ground station
